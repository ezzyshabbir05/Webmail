services:
  caddy-proxy:
    image: caddy:2-alpine
    container_name: postarc-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../data/caddy/data:/data
      - ../data/caddy/config:/config
    command: >
      caddy reverse-proxy
      --from ${POSTARC_HOSTNAME}
      --to postarc-webmail:3000
    depends_on:
      - postarc-webmail
    networks:
      - postarc-network

  postarc-mailserver:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: postarc-mailserver
    restart: unless-stopped
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "4190:4190"
      - "8080:8080"
    volumes:
      - ../data/mailserver/etc:/etc/postarc
      - ../data/mailserver/var:/var/lib/postarc
    environment:
      - STALWART_HOSTNAME=${POSTARC_HOSTNAME}
      - STALWART_PUBLIC_URL=https://${POSTARC_HOSTNAME}
      - STALWART_RECOVERY_ADMIN=admin:${ADMIN_PASSWORD:-PostarcPass2026}
      - CLOUDFLARE_R2_ACCOUNT_ID=${CLOUDFLARE_R2_ACCOUNT_ID}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME}
    networks:
      - postarc-network

  postarc-webmail:
    build:
      context: ../webmail
      dockerfile: Dockerfile
    container_name: postarc-webmail
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POSTARC_SERVER_URL=http://postarc-mailserver:8080
      - POSTARC_HOSTNAME=${POSTARC_HOSTNAME}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME}
    depends_on:
      - postarc-mailserver
    networks:
      - postarc-network

networks:
  postarc-network:
    driver: bridge
