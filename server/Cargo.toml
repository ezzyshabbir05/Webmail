[package]
name = "postarc-server"
version = "1.0.0"
edition = "2021"
authors = ["Postarc Team <hello@postarc.local>"]
description = "Modern, high-performance unified mail server built from scratch"

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.43", features = ["full"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "1.10"
rcgen = { version = "0.13", features = ["pem", "ring"] }
webpki-roots = "0.26"

# HTTP Web Framework & Middleware
axum = { version = "0.8", features = ["json", "tokio"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = { version = "0.5" }

# Database (Bundled SQLite with zero external C dependencies)
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
parking_lot = "0.12"

# Email Standards & MIME
mail-parser = { version = "1.0", features = ["full_encoding"] }
mail-builder = "2.0"
mail-auth = { version = "0.15", default-features = false, features = ["rustls"] }

# DNS MX & TXT Resolution
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }

# Cryptography & Security
argon2 = "0.5"
rsa = { version = "0.9", features = ["pkcs8", "pem"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

# Serialization & Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
